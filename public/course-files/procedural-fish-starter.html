<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
    />
    <title>Procedural Fish Course Starter</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        background: #061019;
        color: #ddecf0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 70% 10%,
            rgba(64, 155, 173, 0.14),
            transparent 35%
          ),
          #061019;
      }

      main {
        width: min(960px, 100%);
        overflow: hidden;
        border: 1px solid rgba(150, 207, 217, 0.2);
        border-radius: 16px;
        background: rgba(2, 10, 16, 0.82);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid rgba(150, 207, 217, 0.12);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 4px 0 0;
        color: rgba(199, 221, 225, 0.58);
        font-size: 11px;
      }

      button {
        min-height: 34px;
        padding: 7px 11px;
        border: 1px solid rgba(128, 205, 218, 0.25);
        border-radius: 999px;
        color: #cce9ed;
        background: rgba(92, 177, 193, 0.07);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid #8dd9e3;
        outline-offset: 3px;
      }

      canvas {
        display: block;
        width: 100%;
        height: min(68vh, 560px);
        touch-action: none;
        cursor: crosshair;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 18px;
        border-top: 1px solid rgba(150, 207, 217, 0.1);
        color: rgba(199, 221, 225, 0.5);
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Course starter · target → mover</h1>
          <p>Move the pointer. Keep the target and root as separate objects.</p>
        </div>
        <button id="toggle" type="button">Pause</button>
      </header>
      <canvas aria-label="A target ring guiding one procedural mover"></canvas>
      <footer>
        <span>Ring = intent</span>
        <span>Dot = controlled root</span>
      </footer>
    </main>

    <script>
      const canvas = document.querySelector("canvas");
      const context = canvas.getContext("2d");
      const toggle = document.querySelector("#toggle");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

      const target = { x: 320, y: 180 };
      const root = { x: 120, y: 180, vx: 0, vy: 0 };
      let width = 1;
      let height = 1;
      let running = !reduceMotion.matches;
      let previous = performance.now();
      let frameHandle = 0;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!Number.isFinite(target.x)) {
          target.x = width * 0.72;
          target.y = height * 0.45;
        }
        draw();
      }

      function update(dt) {
        const stiffness = 20;
        const damping = 8;
        const ax = (target.x - root.x) * stiffness - damping * root.vx;
        const ay = (target.y - root.y) * stiffness - damping * root.vy;

        root.vx += ax * dt;
        root.vy += ay * dt;

        const speed = Math.hypot(root.vx, root.vy);
        const maxSpeed = 280;
        if (speed > maxSpeed) {
          const scale = maxSpeed / speed;
          root.vx *= scale;
          root.vy *= scale;
        }

        root.x = Math.max(20, Math.min(width - 20, root.x + root.vx * dt));
        root.y = Math.max(20, Math.min(height - 20, root.y + root.vy * dt));
      }

      function draw() {
        context.clearRect(0, 0, width, height);
        const glow = context.createRadialGradient(
          target.x,
          target.y,
          0,
          target.x,
          target.y,
          120,
        );
        glow.addColorStop(0, "rgba(91, 189, 205, 0.11)");
        glow.addColorStop(1, "rgba(91, 189, 205, 0)");
        context.fillStyle = glow;
        context.fillRect(0, 0, width, height);

        context.setLineDash([4, 7]);
        context.strokeStyle = "rgba(132, 211, 223, 0.23)";
        context.beginPath();
        context.moveTo(root.x, root.y);
        context.lineTo(target.x, target.y);
        context.stroke();
        context.setLineDash([]);

        context.strokeStyle = "rgba(132, 211, 223, 0.72)";
        context.beginPath();
        context.arc(target.x, target.y, 10, 0, Math.PI * 2);
        context.stroke();

        context.fillStyle = "#edf9fa";
        context.beginPath();
        context.arc(root.x, root.y, 7, 0, Math.PI * 2);
        context.fill();
      }

      function frame(now) {
        const dt = Math.min(0.033, Math.max(0, (now - previous) / 1000));
        previous = now;
        if (running) update(dt);
        draw();
        frameHandle = requestAnimationFrame(frame);
      }

      canvas.addEventListener("pointermove", (event) => {
        const rect = canvas.getBoundingClientRect();
        target.x = event.clientX - rect.left;
        target.y = event.clientY - rect.top;
      });

      toggle.addEventListener("click", () => {
        running = !running;
        previous = performance.now();
        toggle.textContent = running ? "Pause" : "Play";
      });

      reduceMotion.addEventListener("change", (event) => {
        running = !event.matches;
        toggle.textContent = running ? "Pause" : "Play";
      });

      addEventListener("resize", resize);
      addEventListener("beforeunload", () => cancelAnimationFrame(frameHandle));
      resize();
      target.x = width * 0.72;
      target.y = height * 0.45;
      root.x = width * 0.28;
      root.y = height * 0.55;
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
